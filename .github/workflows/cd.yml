name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - service: design-task-dispatch
            context: .
            image: design-task-dispatch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image tag
        id: image-tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.image-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
          source: "docker-compose.yaml"
          target: ${{ vars.DEPLOY_DIR }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PRIVATE_KEY_PASSPHRASE }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            deploy_docker_config=$(mktemp -d)
            export DOCKER_CONFIG="$deploy_docker_config"
            trap 'rm -rf -- "$deploy_docker_config"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            cd "${{ vars.DEPLOY_DIR }}"
            mkdir -p config prompts
            docker compose pull design-task-dispatch
            image=$(docker compose config --images)
            # 首次部署从镜像提取默认配置，后续保留服务器上的修改。
            if [ ! -e config/fields.json ]; then
              docker run --rm --entrypoint cat "$image" /app/config/fields.json > config/fields.json.tmp
              mv config/fields.json.tmp config/fields.json
            fi
            if [ ! -e config/rule_fields.json ]; then
              docker run --rm --entrypoint cat "$image" /app/config/rule_fields.json > config/rule_fields.json.tmp
              mv config/rule_fields.json.tmp config/rule_fields.json
            fi
            if [ ! -e prompts/classify.md ]; then
              docker run --rm --entrypoint cat "$image" /app/prompts/classify.md > prompts/classify.md.tmp
              mv prompts/classify.md.tmp prompts/classify.md
            fi
            # 绑定目录由宿主机持有，启动服务前赋予容器用户写入权限。
            mkdir -p logs
            docker run --rm --user 0:0 --entrypoint sh -v "$PWD/logs:/logs" "$image" -c 'chown -R 10001:10001 /logs && chmod 0750 /logs'
            docker compose up -d --remove-orphans design-task-dispatch
            docker image prune -f
