[project]
name = "design-task-dispatch"
version = "0.1.0"
description = "美工需求识别与任务分配服务"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pillow>=11,<13",
    "pypdfium2>=4,<6",
    "python-dotenv>=1.1,<2",
    "xlrd>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
