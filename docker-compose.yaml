services:
  design-task-dispatch:
    image: "ghcr.io/ranjingya/design-task-dispatch:latest"
    container_name: design-task-dispatch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      FIELD_MAPPING_PATH: /app/config/fields.json
      RULE_FIELD_MAPPING_PATH: /app/config/rule_fields.json
      RULES_CACHE_PATH: /app/cache/rules.json
      CLASSIFY_PROMPT_PATH: /app/prompts/classify.md
    expose:
      - "8000"
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - rules-cache:/app/cache
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-network
      traefik.http.routers.design-task-dispatch.rule: "Host(`design-dispatch.kktree.cn`)"
      traefik.http.routers.design-task-dispatch.entrypoints: websecure
      traefik.http.routers.design-task-dispatch.tls: "true"
      traefik.http.routers.design-task-dispatch.tls.certresolver: myresolver
      traefik.http.services.design-task-dispatch.loadbalancer.server.port: 8000
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true

volumes:
  rules-cache:
